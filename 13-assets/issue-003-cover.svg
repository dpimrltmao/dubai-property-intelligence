<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800">
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#031729" stop-opacity="0.96"/>
      <stop offset="0.52" stop-color="#031729" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#031729" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="bottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#031729" stop-opacity="0"/>
      <stop offset="1" stop-color="#031729" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <image href="dpi-hero-skyline.png" x="0" y="0" width="1200" height="1800" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1200" height="1800" fill="url(#shade)"/>
  <rect y="1260" width="1200" height="540" fill="url(#bottom)"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#f7f9fa">
    <text x="70" y="80" font-size="30" letter-spacing="8">ISSUE 003</text>
    <text x="70" y="125" font-size="27" letter-spacing="6">OCTOBER 2026</text>
    <text x="600" y="85" text-anchor="middle" font-family="Georgia, serif" font-size="92" font-weight="700">DPI</text>
    <text x="600" y="125" text-anchor="middle" font-size="21">Dubai Property Intelligence</text>
    <line x1="70" y1="160" x2="1130" y2="160" stroke="#e6eef2" stroke-width="2"/>
    <text x="600" y="205" text-anchor="middle" fill="#1ed2ef" font-size="23" letter-spacing="9">DATA TODAY. A BRIGHTER TOMORROW.</text>
  </g>

  <g font-family="Georgia, serif" font-weight="700">
    <text x="70" y="430" fill="#ffffff" font-size="108">Dubai Is</text>
    <text x="70" y="545" fill="#ffffff" font-size="108">Cooling -</text>
    <text x="70" y="660" fill="#20d4ef" font-size="108">But Unevenly.</text>
  </g>

  <text x="73" y="745" font-family="Arial, Helvetica, sans-serif" fill="#f3f7f9" font-size="32">
    <tspan x="73" dy="0">Sales are slowing, rents are easing, and buyer power</tspan>
    <tspan x="73" dy="44">is returning - but not at the same speed everywhere.</tspan>
  </text>
  <line x1="73" y1="850" x2="185" y2="850" stroke="#20d4ef" stroke-width="8"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="70" y="1510" fill="#20d4ef" font-size="25" font-weight="700" letter-spacing="5">ALSO INSIDE</text>
    <line x1="250" y1="1502" x2="1130" y2="1502" stroke="#20d4ef" stroke-width="2"/>
    <text x="70" y="1575" fill="#ffffff" font-size="31" font-weight="700">GLOBAL CAPITAL WATCH</text>
    <text x="485" y="1575" fill="#20d4ef" font-size="30">•</text>
    <text x="525" y="1575" fill="#ffffff" font-size="31" font-weight="700">DEVELOPER SCHEDULE HEALTH</text>
    <text x="70" y="1630" fill="#b9c7d1" font-size="24">New DPI intelligence on capital flows and developer schedule risk.</text>
  </g>
</svg>